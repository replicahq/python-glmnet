[build-system]
requires = ["scikit-build-core", "numpy", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "glmnet"
version = "2.2.1"
description = "Python wrapper for glmnet"
readme = "README.rst"
requires-python = ">=3.6"
license = {text = "GNU General Public License v2 (GPLv2)"}
authors = [
    {name = "Civis Analytics Inc", email = "opensource@civisanalytics.com"},
]
dependencies = [
    "numpy>=1.9.2",
    "scikit-learn>=0.18.0",
    "scipy>=0.14.1",
    "joblib>=0.14.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/civisanalytics/python-glmnet"

[tool.ruff]
lint.ignore = ["E741"]  # Ignore ambiguous-variable-name rule

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.version = ">=3.15"
cmake.build-type = "Release"
cmake.args = ["-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON"]

[tool.setuptools]
packages = ["glmnet"]
include-package-data = true

[tool.setuptools.package-data]
glmnet = ["*.so", "*.pyd", "*.dll"]

[tool.scikit-build.cmake.define]
CMAKE_Fortran_FLAGS = "-fdefault-real-8"
Python_FIND_FRAMEWORK = "LAST"
CMAKE_INSTALL_RPATH = "@loader_path"

[tool.scikit-build.sdist]
include = [
    "glmnet/*.py",
    "glmnet/*.pyf",
    "glmnet/src/glmnet/*.f*",
    "CMakeLists.txt",
    "README.rst",
]
exclude = [
    "*.pyc",
    "*/__pycache__",
    ".git*",
    "dist",
    "build",
]

# We'll rely on the runtime import mechanism in __init__.py to build the module if needed
