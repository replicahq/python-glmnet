[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "numpy>=1.9.2",
    "cmake>=3.15",
]
build-backend = "scikit_build_core.build"

[project]
name = "glmnet"
version = "2.2.1"
description = "Python wrapper for glmnet"
readme = "README.rst"
requires-python = ">=3.6"
license = {text = "GNU General Public License v2 (GPLv2)"}
authors = [
    {name = "Civis Analytics Inc", email = "opensource@civisanalytics.com"},
]
dependencies = [
    "numpy>=1.9.2",
    "scikit-learn>=0.18.0",
    "scipy>=0.14.1",
    "joblib>=0.14.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/civisanalytics/python-glmnet"

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.version = "3.15"
cmake.build-type = "Release"
cmake.install.strip = true  # Strip debug symbols from binaries

[tool.scikit-build.cmake.define]
CMAKE_Fortran_FLAGS = "-ffixed-form -fdefault-real-8"
Python_FIND_FRAMEWORK = "LAST"

[tool.scikit-build.metadata]
install_requires = [
    "numpy>=1.9.2",  # Ensure numpy is installed before building
]

[tool.scikit-build.sdist]
include = [
    "glmnet/*.py",
    "glmnet/*.pyf",
    "glmnet/src/glmnet/*.f90",
    "CMakeLists.txt",
    "README.rst",
]
exclude = [
    "*.pyc",
    "*/__pycache__",
    ".git*",
    "dist",
    "build",
]
